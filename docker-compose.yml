version: '3.5'

services:
  # 1. Base de datos (MariaDB)
  mariadb-server:
    image: mariadb:10.11
    container_name: zabbix-db
    environment:
      - MARIADB_DATABASE=zabbix
      - MARIADB_USER=zabbix
      - MARIADB_PASSWORD=zabbix
      - MARIADB_ROOT_PASSWORD=root_password
    volumes:
      - ./mariadb_data:/var/lib/mysql
      # Aquí ocurre la magia: inyecta tu copia de seguridad al arrancar
      - ./copia_completa_zabbix.sql:/docker-entrypoint-initdb.d/backup.sql:ro
    ports:
      - "3306:3306"
    restart: unless-stopped

  # 2. El motor de Zabbix Server
  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.0-latest
    container_name: zabbix-server
    environment:
      - DB_SERVER_HOST=mariadb-server
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix
    ports:
      - "10051:10051"
    depends_on:
      - mariadb-server
    restart: unless-stopped

  # 3. La interfaz Web de Zabbix
  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:ubuntu-7.0-latest
    container_name: zabbix-frontend
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - DB_SERVER_HOST=mariadb-server
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix
      - PHP_TZ=Europe/Madrid
    ports:
      - "8080:8080"
    depends_on:
      - mariadb-server
      - zabbix-server
    restart: unless-stopped

  # 4. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
    volumes:
      # Conecta tu carpeta rescatada directamente a Grafana
      - ./copia_grafana:/var/lib/grafana
    depends_on:
      - zabbix-server
    restart: unless-stopped

  # 5. Zabbix agent
  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    container_name: zabbix-agent-central
    user: root
    network_mode: "host" # Muy importante para que vea la máquina física
    privileged: true
    environment:
      - ZBX_SERVER_HOST=192.168.10.10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped
